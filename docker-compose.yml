services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/weather_auth?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production}
      JWT_ACCESS_TTL_MINUTES: "60"
      WEATHER_API_KEY: ${WEATHER_API_KEY}
      COUNTRY_STATE_CITY_KEY: ${COUNTRY_STATE_CITY_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weather_auth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  pgdata:
